# SCRUM-192 (HU44) — CI/CD con GitHub Actions.
#
# 1) Corre los tests de backend (pytest) contra un Postgres real levantado
#    como "service container" de GitHub Actions.
# 2) Corre los tests de frontend (vitest) y valida que el build de producción
#    (vite build) compile sin errores.
# 3) Si ambos jobs anteriores pasan Y el push fue a main, dispara un deploy en
#    Render llamando a sus Deploy Hooks (URLs guardadas como GitHub Secrets:
#    RENDER_BACKEND_DEPLOY_HOOK y RENDER_FRONTEND_DEPLOY_HOOK). Ver las
#    instrucciones en README-CI-CD.md (en la raíz del repo) para configurarlos.
# 4) En paralelo al deploy, si ambos jobs de tests pasaron y el push fue a
#    main, construye las imágenes Docker de backend y frontend y las sube a
#    Docker Hub (públicas), para poder compartir el link con el profesor.
#    Requiere la variable DOCKERHUB_USERNAME y el secret DOCKERHUB_TOKEN —
#    ver instrucciones en README-CI-CD.md.
#
# Notificación de fallos: no se agrega ningún paso ni credencial extra para
# esto. GitHub ya envía un correo automático a quien hizo el push cuando un
# workflow falla (Settings → Notifications → Actions, en la cuenta de GitHub
# de cada integrante) — no requiere SMTP ni ningún secreto adicional.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: turify-backend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: turify-backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr tests con cobertura
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turify_test
        run: pytest --cov=app --cov-report=term-missing

  frontend-tests:
    name: Tests frontend (vitest) y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turify-frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: turify-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test

      - name: Verificar que el build de producción compile
        run: npm run build

  deploy:
    name: Desplegar en Render
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook del backend
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Disparar deploy hook del frontend
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

  docker-publish:
    name: Publicar imágenes en Docker Hub
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push — imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: turify-backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/turify-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/turify-backend:${{ github.sha }}

      # El Dockerfile del frontend no compila Vite adentro del contenedor
      # (ver el comentario en turify-frontend/Dockerfile) — espera que la
      # carpeta dist/ ya exista. Por eso la generamos acá primero, igual
      # que en el job de tests de frontend.
      - name: Configurar Node (para compilar el frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: turify-frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: turify-frontend
        run: npm ci

      - name: Compilar el frontend (genera dist/)
        working-directory: turify-frontend
        run: npm run build

      - name: Build y push — imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: turify-frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/turify-frontend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/turify-frontend:${{ github.sha }}
