version: '3.9'

services:

  # ── Base de datos PostgreSQL local ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: turify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: turify_db
    ports:
      - "5432:5432"
    volumes:
      - turify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./turify-backend
      dockerfile: Dockerfile
    container_name: turify-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://turify_app:Turify2026@db:5432/turify_db
      ENV: ${ENV:-development}
      SECRET_KEY: ${SECRET_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./turify-backend:/app

  # ── Frontend React/Vite ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./turify-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: turify-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  turify_pg_data:
