server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router — todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── HU31 — Cabeceras de seguridad HTTP ──────────────────────────────────
    # Evita que Turify se embeba en un <iframe> de otro sitio (clickjacking).
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Evita que el navegador "adivine" el tipo de contenido (MIME sniffing).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Fuerza HTTPS en el navegador durante 2 años. Solo tiene efecto si el
    # sitio ya se sirve por HTTPS (Railway/Vercel lo hacen por defecto).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy: restringe a los orígenes que Turify realmente
    # usa (Google Fonts, Supabase) más los que exige la propia guía oficial
    # de Google para incrustar el SDK de Maps JavaScript API (ver
    # https://developers.google.com/maps/documentation/javascript/content-security-policy).
    # NOTA: Google Maps exige 'unsafe-inline' y 'unsafe-eval' en script-src —
    # su SDK los usa internamente y no hay forma de evitarlo sin una CSP con
    # nonce por request (no viable en una SPA servida como archivos estáticos
    # por Nginx). Esto reduce lo que la CSP puede mitigar contra XSS, pero
    # sigue bloqueando iframes ajenos, plugins y fuentes de conexión/imagen
    # no autorizadas. 'http://localhost:8000' es el backend en docker-compose
    # local (se listan tanto 'localhost' como '127.0.0.1' porque el navegador
    # los trata como orígenes distintos, y el build puede quedar apuntando a
    # cualquiera de los dos); al desplegar a un dominio de producción (ver
    # HU44 — CI/CD) hay que reemplazarlos por ese dominio en connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com *.google.com https://*.ggpht.com *.googleusercontent.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com *.google.com *.googleusercontent.com https://*.supabase.co; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https://*.supabase.co wss://*.supabase.co https://*.googleapis.com *.google.com https://*.gstatic.com data: blob:; worker-src 'self' blob:; frame-src 'self' *.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}
